<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AIGC Web 检测页性能测试报告">
    <meta name="author" content="AIGC 开发团队">

    <title>AIGC Web 性能测试报告 - 检测页</title>

    <!-- ==================== CSS 样式引入 ==================== -->
    <!-- Bootstrap Core CSS -->
    <link href="sbadmin2-1.0.7/bower_components/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- MetisMenu CSS -->
    <link href="sbadmin2-1.0.7/bower_components/metisMenu/dist/metisMenu.min.css" rel="stylesheet">
    <!-- SB Admin 2 Custom CSS -->
    <link href="sbadmin2-1.0.7/dist/css/sb-admin-2.css" rel="stylesheet">
    <!-- JMeter Dashboard CSS -->
    <link href="content/css/dashboard.css" rel="stylesheet">
    <!-- Table Sorter Theme -->
    <link href="content/css/theme.blue.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="sbadmin2-1.0.7/bower_components/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="content/pages/icon-apache.png" />

    <!-- ==================== 自定义覆盖样式 ==================== -->
    <style>
        /* 统一面板标题居中样式，替代内联 style */
        .panel-heading-center {
            text-align: center;
        }
        /* 图表容器固定高度 */
        .chart-container {
            height: 200px;
        }
        /* 导航栏底部间距微调 */
        .navbar-static-top {
            margin-bottom: 0;
        }
        /* 表格内容左对齐优化，提升数据可读性 */
        #generalInfos td:first-child {
            font-weight: bold;
            text-align: right;
            width: 30%;
        }
    </style>
</head>

<body>
    <div id="wrapper">

        <!-- ==================== 顶部与侧边栏导航区域 ==================== -->
        <nav class="navbar navbar-default navbar-static-top" role="navigation">
            <!-- 顶部品牌与移动端折叠按钮 -->
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="sr-only">切换导航</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="index.html">AIGC 性能测试报告</a>
            </div>

            <!-- 侧边栏菜单 -->
            <div class="navbar-default sidebar" role="navigation">
                <div class="sidebar-nav navbar-collapse">
                    <ul class="nav" id="side-menu">
                        <li>
                            <a href="index.html"><i class="fa fa-dashboard fa-fw"></i> 仪表盘</a>
                        </li>
                        <li>
                            <a href="#"><i class="fa fa-bar-chart-o fa-fw"></i> 图表<span class="fa arrow"></span></a>
                            <ul class="nav nav-second-level">
                                <li><a href="content/pages/OverTime.html">随时间变化</a></li>
                                <li><a href="content/pages/Throughput.html">吞吐量</a></li>
                                <li><a href="content/pages/ResponseTimes.html">响应时间</a></li>
                            </ul>
                        </li>
                        <li>
                            <a href="#"><i class="fa fa-bar-chart-o fa-fw"></i> 自定义图表<span class="fa arrow"></span></a>
                            <ul class="nav nav-second-level">
                                <li><a href="content/pages/CustomsGraphs.html">随时间变化</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- ==================== 页面主体内容区域 ==================== -->
        <div id="page-wrapper">

            <!-- 1. 测试基础信息面板 -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="panel panel-default">
                        <div class="panel-heading panel-heading-center">
                            <p class="dashboard-title">测试与报告信息</p>
                        </div>
                        <div class="panel-body">
                            <table id="generalInfos" class="table table-bordered table-condensed">
                                <tr><td>源文件</td><td>"results_detect_page.jtl"</td></tr>
                                <tr><td>开始时间</td><td>"4/20/26, 4:51 PM"</td></tr>
                                <tr><td>结束时间</td><td>"4/20/26, 4:55 PM"</td></tr>
                                <tr><td>显示过滤器</td><td>""</td></tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. APDEX 与 请求摘要面板 (双列布局) -->
            <div class="row">
                <!-- APDEX 指数 -->
                <div class="col-lg-6">
                    <div class="panel panel-default panel-heading-center">
                        <div class="panel-heading">
                            <p class="dashboard-title">
                                <a href="https://en.wikipedia.org/wiki/Apdex" target="_blank">APDEX (应用性能指数)</a>
                            </p>
                        </div>
                        <div class="panel-body">
                            <section id="apdex" class="col-md-12 table-responsive">
                                <table id="apdexTable" class="table table-bordered table-condensed tablesorter"></table>
                            </section>
                        </div>
                    </div>
                </div>
                <!-- 请求摘要饼图 -->
                <div class="col-lg-6">
                    <div class="panel panel-default panel-heading-center">
                        <div class="panel-heading">
                            <p class="dashboard-title">请求摘要</p>
                        </div>
                        <div class="panel-body">
                            <div class="flot-chart chart-container">
                                <div class="flot-chart-content" id="flot-requests-summary"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 核心统计数据面板 (全宽) -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="panel panel-default panel-heading-center">
                        <div class="panel-heading">
                            <p class="dashboard-title">统计数据</p>
                        </div>
                        <div class="panel-body">
                            <section class="col-md-12 table-responsive">
                                <table id="statisticsTable" class="table table-bordered table-condensed tablesorter"></table>
                            </section>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. 错误信息面板 (全宽) -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="panel panel-default panel-heading-center">
                        <div class="panel-heading">
                            <p class="dashboard-title">错误信息</p>
                        </div>
                        <div class="panel-body">
                            <section class="col-md-12 table-responsive">
                                <table id="errorsTable" class="table table-bordered table-condensed tablesorter"></table>
                            </section>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. 前5大错误统计面板 (全宽) -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="panel panel-default panel-heading-center">
                        <div class="panel-heading">
                            <p class="dashboard-title">按采样器统计的前5大错误</p>
                        </div>
                        <div class="panel-body">
                            <section class="col-md-12 table-responsive">
                                <table id="top5ErrorsBySamplerTable" class="table table-bordered table-condensed tablesorter"></table>
                            </section>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <!-- /#page-wrapper -->
    </div>
    <!-- /#wrapper -->

    <!-- ==================== JavaScript 脚本引入 ==================== -->
    <!-- jQuery 核心库 -->
    <script src="sbadmin2-1.0.7/bower_components/jquery/dist/jquery.min.js"></script>

    <!-- Bootstrap 核心脚本 -->
    <script src="sbadmin2-1.0.7/bower_components/bootstrap/dist/js/bootstrap.min.js"></script>

    <!-- Flot 图表库及其插件 -->
    <script src="sbadmin2-1.0.7/bower_components/flot/excanvas.min.js"></script>
    <script src="sbadmin2-1.0.7/bower_components/flot/jquery.flot.js"></script>
    <script src="sbadmin2-1.0.7/bower_components/flot/jquery.flot.pie.js"></script>
    <script src="sbadmin2-1.0.7/bower_components/flot/jquery.flot.resize.js"></script>
    <script src="sbadmin2-1.0.7/bower_components/flot/jquery.flot.time.js"></script>
    <script src="sbadmin2-1.0.7/bower_components/flot.tooltip/js/jquery.flot.tooltip.min.js"></script>
    <script src="sbadmin2-1.0.7/bower_components/flot-axislabels/jquery.flot.axislabels.js"></script>

    <!-- MetisMenu 折叠菜单插件 -->
    <script src="sbadmin2-1.0.7/bower_components/metisMenu/dist/metisMenu.min.js"></script>

    <!-- JMeter Dashboard 业务逻辑脚本 -->
    <script src="content/js/dashboard-commons.js"></script>
    <script src="content/js/dashboard.js"></script>

    <!-- SB Admin 2 主题脚本与表格排序插件 -->
    <script src="sbadmin2-1.0.7/dist/js/sb-admin-2.js"></script>
    <script type="text/javascript" src="content/js/jquery.tablesorter.min.js"></script>

</body>
</html>
