<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - AI 文本检测系统</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260420-2" />
</head>
<body>
  <div class="bg-shape bg-one"></div>
  <div class="bg-shape bg-two"></div>

  <main class="auth-wrap" role="main">
    <section class="card auth-box" aria-labelledby="loginTitle">
      <h1 id="loginTitle" class="auth-title">用户登录</h1>
      <p class="muted auth-subtitle">请输入您的用户名与密码</p>

      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="用户名" />

      <label for="password">密码</label>
      <div class="password-input-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
        <button id="togglePasswordBtn" type="button" class="password-eye" aria-label="显示或隐藏密码" title="显示/隐藏密码"></button>
      </div>

      <button id="loginBtn" class="primary big" type="button">登录</button>
      <button id="goRegisterBtn" class="ghost big" type="button">没有账号？去注册</button>
      <p id="msg" class="msg" aria-live="polite"></p>
    </section>
  </main>

  <script src="/static/common.js?v=20260417-4"></script>
  <script src="/static/login.js?v=20260417-4"></script>
</body>
</html>
